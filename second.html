<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            padding: 50px;
        }

        .profile-card {
            width: 320px;
            margin: 0 auto;
            background-color: white;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
        }

        .avatar-container {
            padding: 20px;
        }

        .avatar-img {
            width: 100px;
            height: 100px;
            border: 4px solid white;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-content {
            padding: 20px;
        }

        .user-name {
            color: #0f172a;
        }

        .user-role {
            color: #64748b;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .action-btn:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
        }

        .action-btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <div class="avatar-container">
            <img src="avatar.jpg" alt="Profile avatar" class="avatar-img">
        </div>

        <div class="profile-content">

            <h2 class="user-name">Dr. Sarah Khan</h2>

            <p class="user-role">
                Associate Professor and Researcher
            </p>

            <button class="action-btn">
                View Profile
            </button>

        </div>

    </div>

</body>
</html>
