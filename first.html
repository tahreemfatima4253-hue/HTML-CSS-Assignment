<!DOCTYPE html>
<html>
<head>
    <title>Article Preview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 50px 20px;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            color: #334155;
        }

        .article-card {
            max-width: 550px;
            margin: 0 auto;
            padding: 32px;
            background-color: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            background-color: #e0e7ff;
            color: #3730a3;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
        }

        .article-title {
            color: #0f172a;
            font-size: 28px;
            font-weight: bold;
        }

        .article-meta {
            color: #64748b;
            font-size: 14px;
        }

        .article-excerpt {
            line-height: 1.6;
        }

        .read-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .read-btn:hover {
            background-color: #0369a1;
        }

        .read-btn:active {
            background-color: #075985;
        }
    </style>
</head>

<body>

    <article class="article-card">

        <span class="category-badge">Web Development</span>

        <h1 class="article-title">
            Mastering Cascading Style Sheets
        </h1>

        <p class="article-meta">
            Published on September 9, 2026
        </p>

        <p class="article-excerpt">
            CSS gives developers control over webpage presentation,
            layout, colors, typography, and spacing.
        </p>

        <div class="article-footer">
            <a href="#" class="read-btn">Read Article →</a>
        </div>

    </article>

</body>
</html>
